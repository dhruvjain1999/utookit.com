<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      .serif { font-family: 'DM Serif Display', Georgia, 'Times New Roman', serif; }
      .sans  { font-family: 'Inter', Arial, Helvetica, sans-serif; }
    </style>
  </defs>
  <rect width="1200" height="630" fill="#FFF8F2"/>
  <!-- giant faded wordmark -->
  <text x="600" y="430" text-anchor="middle" class="serif" font-size="360" fill="#E8DDD5" opacity="0.5" letter-spacing="-12">TOOKIT</text>

  <!-- logo -->
  <text x="80" y="110" class="serif" font-size="48" fill="#FF6B35">Tookit</text>

  <!-- headline -->
  <text x="80" y="280" class="serif" font-size="104" fill="#111" letter-spacing="-3">Never miss</text>
  <text x="80" y="392" class="serif" font-size="104" fill="#111" letter-spacing="-3">a <tspan fill="#FF6B35" font-style="italic">pill</tspan> again.</text>

  <!-- subhead -->
  <text x="82" y="470" class="sans" font-size="34" fill="#6B5E52">A daily text. A call if you don't reply. An alert if needed.</text>

  <!-- badges -->
  <g class="sans" font-size="26" font-weight="600">
    <rect x="80" y="520" width="240" height="60" rx="30" fill="#fff" stroke="#ffd0bb"/>
    <text x="200" y="559" text-anchor="middle" fill="#FF6B35">$2.99 / month</text>
    <rect x="340" y="520" width="240" height="60" rx="30" fill="#fff" stroke="#E8DDD5"/>
    <text x="460" y="559" text-anchor="middle" fill="#6B5E52">7 days free</text>
    <rect x="600" y="520" width="260" height="60" rx="30" fill="#fff" stroke="#E8DDD5"/>
    <text x="730" y="559" text-anchor="middle" fill="#6B5E52">No app required</text>
  </g>
</svg>
